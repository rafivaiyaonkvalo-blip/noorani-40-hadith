<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নূরানী ৪০ হাদিস শরীফ | মারকাযুল ঈমান - দাওয়াহ্ বিভাগ</title>
  
  <!-- Google Fonts: Amiri, Harmattan, Lateef, Noto Naskh Arabic, Scheherazade New, Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Harmattan:wght@400;700&family=Hind+Siliguri:wght@400;500;600;700&family=Lateef:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- PPTXGenJS for 1-click PowerPoint export -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

  <style>
    :root {
      --primary: #04432c;
      --primary-dark: #02291b;
      --primary-light: #065f3e;
      --accent-gold: #c69214;
      --accent-gold-light: #f59e0b;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
      --bg-cream: #fdfbf7;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --text-muted: #4b5563;
      --border-color: #e5e7eb;
      --arabic-font: 'Scheherazade New', serif;
      --arabic-size: 38px;
      --dua-arabic-size: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: #0f172a;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Control Bar */
    .top-bar {
      background: #02291b;
      color: #fff;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 100;
    }

    .org-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .org-logo-mini {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fff;
      object-fit: contain;
      padding: 2px;
      border: 2px solid #d4af37;
    }

    .org-title-group h1 {
      font-size: 15px;
      font-weight: 700;
      color: #f3e5ab;
      line-height: 1.2;
    }

    .org-title-group p {
      font-size: 11px;
      color: #a7f3d0;
      letter-spacing: 0.5px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      font-family: 'Hind Siliguri', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #02291b;
      font-weight: 700;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #e5c158, #c69214);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: rgba(255,255,255,0.1);
      color: #f8fafc;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .btn-outline:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Main Presentation Container */
    .presentation-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    /* Slide Card 16:9 Aspect Ratio */
    .slide-viewport {
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: var(--bg-cream);
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,175,55,0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Slide Decorative Borders */
    .slide-viewport::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1.5px solid rgba(198, 146, 20, 0.3);
      border-radius: 12px;
      pointer-events: none;
      z-index: 2;
    }

    .slide-viewport::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border: 0.8px dashed rgba(198, 146, 20, 0.4);
      border-radius: 8px;
      pointer-events: none;
      z-index: 2;
    }

    /* Slide Header Inside Card */
    .slide-header {
      padding: 16px 32px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 3;
      border-bottom: 1px solid rgba(198, 146, 20, 0.2);
      background: linear-gradient(to bottom, rgba(4, 67, 44, 0.04), transparent);
    }

    .slide-brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slide-logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .slide-brand-text .b1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }
    .slide-brand-text .b2 {
      font-size: 11px;
      color: #6b7280;
    }

    .slide-badge-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hadith-number-pill {
      background: linear-gradient(135deg, #04432c, #065f3e);
      color: #f3e5ab;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid #d4af37;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .hadith-cat-tag {
      background: #fef3c7;
      color: #92400e;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Slide Content Body */
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px 48px 20px;
      text-align: center;
      position: relative;
      z-index: 3;
    }

    /* Arabic Box */
    .arabic-wrapper {
      margin-bottom: 14px;
      width: 100%;
    }

    .arabic-text {
      font-family: var(--arabic-font);
      font-size: var(--arabic-size);
      font-weight: 700;
      color: #02291b;
      line-height: 1.65;
      direction: rtl;
      word-spacing: 4px;
      text-shadow: 0 1px 1px rgba(0,0,0,0.08);
      transition: font-size 0.15s ease, font-family 0.15s ease;
    }

    .dua-arabic {
      font-family: var(--arabic-font) !important;
      font-size: var(--dua-arabic-size) !important;
      line-height: 1.8;
      color: #02291b;
      text-align: center;
      transition: font-size 0.15s ease, font-family 0.15s ease;
    }

    /* Reading Controls: Font Family & Size Adjuster */
    .reading-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      padding: 8px 18px;
      background: rgba(2, 41, 27, 0.85);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(212, 175, 55, 0.45);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      width: 100%;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      color: #f3e5ab;
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .font-select-picker {
      background: #04432c;
      color: #ffffff;
      border: 1.5px solid #d4af37;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .font-select-picker:hover, .font-select-picker:focus {
      background: #065f3e;
      border-color: #f59e0b;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    .font-select-picker option {
      background: #02291b;
      color: #ffffff;
    }

    .size-control-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-size-step {
      background: #04432c;
      color: #f3e5ab;
      border: 1.5px solid #d4af37;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn-size-step:hover {
      background: #d4af37;
      color: #02291b;
      transform: translateY(-1px);
    }

    .btn-size-step:active {
      transform: translateY(1px);
    }

    .size-indicator-badge {
      min-width: 50px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      color: #a7f3d0;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      font-family: monospace;
    }

    .btn-size-reset {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-size-reset:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .arabic-ornament {
      color: #d4af37;
      font-size: 18px;
      margin: 4px 0 10px;
      letter-spacing: 6px;
    }

    /* Pronunciation Box */
    .pronunciation-box {
      font-size: 16px;
      color: #4b5563;
      font-style: italic;
      margin-bottom: 12px;
      background: rgba(4, 67, 44, 0.05);
      display: inline-block;
      padding: 4px 18px;
      border-radius: 20px;
      border-left: 3px solid #04432c;
      border-right: 3px solid #04432c;
    }

    /* Bangla Meaning */
    .bangla-wrapper {
      max-width: 900px;
      margin-bottom: 14px;
    }

    .bangla-text {
      font-size: 24px;
      font-weight: 700;
      color: #111827;
      line-height: 1.5;
    }

    /* Slide Footer */
    .slide-footer {
      padding: 8px 36px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 3;
      border-top: 1px solid rgba(198, 146, 20, 0.15);
      font-size: 12.5px;
      color: #4b5563;
    }

    .hadith-source {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #04432c;
      background: #ecfdf5;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #a7f3d0;
    }

    .slide-counter {
      font-weight: 600;
      color: #6b7280;
    }

    /* Floating Navigation Controls */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(2, 41, 27, 0.85);
      color: #f3e5ab;
      border: 2px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      z-index: 50;
    }

    .nav-arrow:hover {
      background: #04432c;
      color: #fff;
      transform: translateY(-50%) scale(1.1);
    }

    .nav-prev { left: -26px; }
    .nav-next { right: -26px; }

    /* Bottom Quick Nav Bar */
    .bottom-bar {
      background: #02291b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      font-size: 13px;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }

    .tab-btn.active {
      background: #d4af37;
      color: #02291b;
      font-weight: 700;
      border-color: #d4af37;
    }

    .slide-select-dropdown {
      background: #04432c;
      color: #f3e5ab;
      border: 1px solid #d4af37;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    /* Cover / Intro Slide Special Styling */
    .cover-slide-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 24px 40px;
    }

    .cover-logo-lg {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 50%;
      background: #fff;
      padding: 6px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      border: 3px solid #d4af37;
    }

    .cover-title {
      font-size: 34px;
      font-weight: 800;
      color: #02291b;
      margin-bottom: 6px;
    }

    .cover-subtitle {
      font-size: 20px;
      color: #92400e;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .cover-org {
      font-size: 17px;
      color: #04432c;
      font-weight: 600;
      background: #ecfdf5;
      padding: 6px 24px;
      border-radius: 30px;
      border: 1px solid #a7f3d0;
      margin-bottom: 18px;
    }

    .cover-info {
      font-size: 14px;
      color: #4b5563;
      max-width: 600px;
      line-height: 1.6;
    }

    /* Modal Grid View */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      overflow-y: auto;
      padding: 8px 4px;
    }

    .grid-item {
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    .grid-item:hover {
      border-color: #04432c;
      background: #ecfdf5;
      transform: translateY(-2px);
    }

    .grid-item.active {
      border-color: #d4af37;
      background: #fef3c7;
      font-weight: 700;
    }

    .grid-num {
      font-size: 16px;
      font-weight: 700;
      color: #04432c;
    }

    .grid-title {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Print Stylesheet */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
      }
      .top-bar, .bottom-bar, .nav-arrow, .modal-overlay {
        display: none !important;
      }
      .presentation-stage {
        padding: 0 !important;
        display: block !important;
      }
      .slide-viewport {
        max-width: 100% !important;
        width: 100% !important;
        box-shadow: none !important;
        border: 2px solid #000 !important;
        page-break-after: always !important;
        height: 100vh !important;
        margin-bottom: 20px !important;
      }
    }

    /* Mobile & Tablet Responsive Media Queries */
    .mobile-nav-bar {
      display: none;
    }

    @media screen and (max-width: 900px) {
      .presentation-stage {
        padding: 12px 10px;
      }
      .slide-viewport {
        aspect-ratio: auto;
        min-height: 480px;
      }
      .arabic-text {
        font-size: 30px;
      }
      .bangla-text {
        font-size: 21px;
      }
      .nav-arrow {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }
      .nav-prev { left: -12px; }
      .nav-next { right: -12px; }
    }

    @media screen and (max-width: 640px) {
      body {
        padding-bottom: 20px;
      }
      .top-bar {
        padding: 8px 12px;
        flex-direction: column;
        gap: 8px;
      }
      .org-brand {
        width: 100%;
        justify-content: center;
      }
      .org-logo-mini {
        width: 32px;
        height: 32px;
      }
      .org-title-group h1 {
        font-size: 13.5px;
        text-align: center;
      }
      .org-title-group p {
        font-size: 10px;
        text-align: center;
      }
      .toolbar-actions {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      .btn {
        padding: 5px 8px;
        font-size: 11px;
      }

      .presentation-stage {
        padding: 10px 8px;
        align-items: flex-start;
      }
      .slide-viewport {
        aspect-ratio: auto;
        min-height: auto;
        border-radius: 12px;
      }
      .slide-viewport::before {
        top: 6px; left: 6px; right: 6px; bottom: 6px;
      }
      .slide-viewport::after {
        top: 9px; left: 9px; right: 9px; bottom: 9px;
      }

      .slide-header {
        padding: 10px 12px 6px;
      }
      .slide-logo-img {
        width: 32px;
        height: 32px;
      }
      .slide-brand-text .b1 {
        font-size: 12.5px;
      }
      .slide-brand-text .b2 {
        font-size: 9.5px;
      }
      .hadith-number-pill {
        font-size: 12px;
        padding: 3px 10px;
      }
      .hadith-cat-tag {
        display: none;
      }

      .slide-body {
        padding: 14px 14px 16px;
      }
      .arabic-text {
        font-size: var(--arabic-size) !important;
        line-height: 1.65;
        word-spacing: 2px;
      }
      .arabic-ornament {
        font-size: 13px;
        margin: 2px 0 6px;
      }
      .pronunciation-box {
        font-size: 13px;
        padding: 4px 12px;
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .bangla-text {
        font-size: 17px;
        line-height: 1.5;
      }
      .dua-slide-body {
        padding: 12px 10px !important;
      }
      .dua-arabic {
        font-size: var(--dua-arabic-size) !important;
        line-height: 1.7 !important;
      }
      .dua-pronun {
        font-size: 12px !important;
      }
      .dua-bangla {
        font-size: 13.5px !important;
      }

      .reading-controls-bar {
        padding: 6px 10px;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .control-group {
        justify-content: space-between;
        width: 100%;
      }
      .font-select-picker {
        flex: 1;
        max-width: 220px;
        font-size: 12px;
        padding: 5px 8px;
      }
      .btn-size-step {
        padding: 5px 12px;
        font-size: 13px;
      }

      .slide-footer {
        padding: 8px 12px 10px;
        flex-direction: column;
        gap: 6px;
        font-size: 11.5px;
      }
      .hadith-source {
        width: 100%;
        justify-content: center;
        font-size: 11px;
      }
      .slide-counter {
        font-size: 11px;
      }

      .nav-arrow {
        display: none !important;
      }

      /* Mobile Navigation Bar */
      .mobile-nav-bar {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        width: 100%;
      }
      .btn-mobile-nav {
        flex: 1;
        padding: 10px;
        font-size: 14px;
        font-weight: 700;
        background: #02291b;
        color: #f3e5ab;
        border: 1.5px solid #d4af37;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-family: inherit;

    const DUA_QUNOOT = {"title":"দোয়া কুনুত (বিতির নামাযের বিশেষ দোয়া)","arabic":"اَللَّهُمَّ إِنَّا نَسْتَعِينُكَ وَنَسْتَغْفِرُكَ وَنُؤْمِنُ بِكَ وَنَتَوَكَّلُ عَلَيْكَ وَنُثْنِي عَلَيْكَ الْخَيْرَ وَنَشْكُرُكَ وَلَا نَكْفُرُكَ وَنَخْلَعُ وَنَتْرُكُ مَنْ يَفْجُرُكَ ❖ اَللَّهُمَّ إِيَّاكَ نَعْبُدُ وَلَكَ نُصَلِّي وَنَسْجُدُ وَإِلَيْكَ نَسْعَى وَنَحْفِدُ وَنَرْجُو رَحْمَتَكَ وَنَخْشَى عَذَابَكَ إِنَّ عَذَابَكَ بِالْكُفَّارِ مُلْحِقٌ","pronunciation":"আল্লাহুম্মা ইন্না নাসতা'ঈনুকা ওয়া নাসতাগফিরুকা ওয়া নু'মিনু বিকা ওয়া নাতাওয়াক্কালু 'আলাইকা ওয়া নুছনী 'আলাইকাল খাইর, ওয়া নাশকুরুকা ওয়ালা নাকফুরুক, ওয়া নাখলা'উ ওয়া নাতরুকু মাই-ইয়াফজুরুক। আল্লাহুম্মা ইয়্যাকা না'বুদু ওয়া লাকা নুসল্লী ওয়া নাসজুদ, ওয়া ইলাইকা নাস'আ ওয়া নাহফিদ, ওয়া নারজু রাহমাতাকা ওয়া নাখশা 'আযাবাকা, ইন্না 'আযাবাকা বিল কুফফারি মুলহিক্ব।","bangla":"হে আল্লাহ! আমরা আপনারই নিকট সাহায্য প্রার্থনা করিতেছি, আপনার নিকট ক্ষমা চাহিতেছি, আপনারই প্রতি ঈমান আনিতেছি, আপনারই উপর ভরসা করিতেছি এবং আপনার উত্তম প্রশংসা করিতেছি। আমরা আপনার কৃতজ্ঞতা জ্ঞাপন করিতেছি, আপনার অকৃতজ্ঞতা করিতেছি না। যে আপনার নাফরমানি করে, আমরা তাহাকে বর্জন করিতেছি ও তাহার সহিত সম্পর্ক ছিন্ন করিতেছি। হে আল্লাহ! আমরা কেবল আপনারই ইবাদত করি, কেবল আপনারই জন্য নামায পড়ি ও সিজদা করি। আমরা আপনারই দিকে দৌড়াই ও আপনার আনুগত্যের জন্য প্রস্তুত হই। আমরা আপনার রহমতের আশা করি এবং আপনার শাস্তিকে ভয় করি। নিশ্চয়ই আপনার শাস্তি কাফেরদের উপর আপতিত হইবে।","source":"বিতির নামাযের দোয়া কুনুত (মুসান্নাফ ইবনে আবী শায়বা, সুনানুল কুবরা লিল বায়হাকী)","category":"বিতির নামাযের দোয়া"};

    let currentArabicFont = localStorage.getItem('noorani_arabic_font') || "'Scheherazade New', serif";
    let currentArabicSizeDelta = parseInt(localStorage.getItem('noorani_arabic_size_delta') || '0', 10);

    function applyTypography() {
      document.documentElement.style.setProperty('--arabic-font', currentArabicFont);

      const isMobile = window.innerWidth <= 640;
      const baseSize = isMobile ? 23 : 38;
      const duaBase = isMobile ? 18 : 24;

      const effectiveSize = Math.max(16, Math.min(56, baseSize + currentArabicSizeDelta)) + 'px';
      const effectiveDua = Math.max(14, Math.min(44, duaBase + currentArabicSizeDelta)) + 'px';

      document.documentElement.style.setProperty('--arabic-size', effectiveSize);
      document.documentElement.style.setProperty('--dua-arabic-size', effectiveDua);

      const sizeLabel = document.getElementById('fontSizeLabel');
      if (sizeLabel) {
        const percent = Math.round(((baseSize + currentArabicSizeDelta) / baseSize) * 100);
        sizeLabel.textContent = percent + '%';
      }

      const fontSelect = document.getElementById('arabicFontSelect');
      if (fontSelect && fontSelect.value !== currentArabicFont) {
        fontSelect.value = currentArabicFont;
      }
    }

    function changeArabicFont(fontFamily) {
      currentArabicFont = fontFamily;
      localStorage.setItem('noorani_arabic_font', fontFamily);
      applyTypography();
      showToast('আরবি ফন্ট পরিবর্তন করা হয়েছে');
    }

    function adjustArabicFontSize(delta) {
      currentArabicSizeDelta = Math.max(-10, Math.min(18, currentArabicSizeDelta + delta));
      localStorage.setItem('noorani_arabic_size_delta', currentArabicSizeDelta.toString());
      applyTypography();
      showToast(delta > 0 ? 'ফন্টের আকার বড় করা হয়েছে (A+)' : 'ফন্টের আকার ছোট করা হয়েছে (A-)');
    }

    function resetArabicTypography() {
      currentArabicSizeDelta = 0;
      currentArabicFont = "'Scheherazade New', serif";
      localStorage.removeItem('noorani_arabic_font');
      localStorage.removeItem('noorani_arabic_size_delta');
      applyTypography();
      showToast('স্বাভাবিক ফন্ট ও আকারে রিসেট হয়েছে');
    }

    window.addEventListener('resize', applyTypography);

    function nextSlide() {

      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
      }
    }

    function jumpToSlide(idx) {
      if (idx >= 0 && idx <= filteredList.length + 1) {
        currentIndex = idx;
        renderSlide();
      }
    }

    function jumpToDuaQunoot() {
      currentIndex = filteredList.length + 1;
      renderSlide();
    }

    // Modal Grid View
    function openGridModal() {
      renderModalGrid();
      document.getElementById('gridModal').classList.add('active');

    function closeGridModal() {
      document.getElementById('gridModal').classList.remove('active');
    }

    function renderModalGrid() {
      const container = document.getElementById('modalGridContainer');
      container.innerHTML = '';

      const coverItem = document.createElement('div');
      coverItem.className = 'grid-item' + (currentIndex === 0 ? ' active' : '');
      coverItem.innerHTML = '<div class="grid-num">🌟</div><div class="grid-title">প্রচ্ছদ</div>';
      coverItem.onclick = () => { jumpToSlide(0); closeGridModal(); };
      container.appendChild(coverItem);

      filteredList.forEach((h, idx) => {
        const item = document.createElement('div');
        item.className = 'grid-item' + (currentIndex === (idx + 1) ? ' active' : '');
        item.innerHTML = `
          <div class="grid-num">${h.no}</div>
          <div class="grid-title">${h.bangla.substring(0, 18)}...</div>
        `;
        item.onclick = () => { jumpToSlide(idx + 1); closeGridModal(); };
        container.appendChild(item);
      });

      const duaItem = document.createElement('div');
      duaItem.className = 'grid-item' + (currentIndex === (filteredList.length + 1) ? ' active' : '');

    // Fullscreen Toggle
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          document.getElementById('fs-icon').textContent = '🗗';
        }).catch(err => {
          showToast('ফুলস্ক্রিন মোড চালু করা যায়নি');
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            document.getElementById('fs-icon').textContent = '⛶';
          });
        }
      }
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key === 'Home') {
        jumpToSlide(0);
      } else if (e.key === 'End') {
        jumpToSlide(filteredList.length + 1);
      } else if (e.key === 'Escape') {
        closeGridModal();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
      } else if (e.key === '+' || e.key === '=') {
        adjustArabicFontSize(2);
      } else if (e.key === '-' || e.key === '_') {
        adjustArabicFontSize(-2);
      } else if (e.key === '0') {
        resetArabicTypography();
      }
    });

        duaSlide.addText("বিশেষ সংযোজন: দোয়া কুনুত", {

          fontSize: 12, color: '065F3E', align: 'right', fontFace: 'Arial', bold: true
        });

        pptx.writeFile({ fileName: 'Noorani_40_Hadith_Markazul_Iman.pptx' })
          .then(fileName => {
            showToast('PowerPoint ফাইল সফলভাবে ডাউনলোড হয়েছে: ' + fileName);
          })
          .catch(err => {
            console.error(err);
            showToast('পিপিটি ডাউনলোড করতে সমস্যা হয়েছে');
          });
      } catch (e) {
        console.error(e);
        showToast('PptxGenJS লোড হতে পারেনি। ইন্টারনেট কানেকশন চেক করুন');
      }
    }

    // Touch swipe support for mobile phones
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) {
          nextSlide(); // swipe left -> next
        } else {
          prevSlide(); // swipe right -> prev
        }
      }
    }, { passive: true });

    // Init
    applyTypography();
    updateDropdown();
    renderSlide();
  </script>
</body>
</html>
